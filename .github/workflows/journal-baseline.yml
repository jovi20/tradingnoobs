name: Journal Baseline

on:
  pull_request:
  push:
    branches:
      - dev
      - main

permissions:
  contents: read

jobs:
  journal-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16.14-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: backend/requirements-ci.lock.txt

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install exact toolchain and backend dependencies
        run: |
          python -m pip install --upgrade pip==26.1.2
          python -m pip install --require-hashes -r backend/requirements-ci.lock.txt
          npm install --global npm@11.16.0

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run journal baseline gate
        env:
          JRN002_POSTGRES_URL: postgresql+psycopg2://postgres:postgres@127.0.0.1:5432/postgres
        run: python scripts/run_journal_baseline_gate.py

      - name: Upload gate summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jrn002-gate-summary
          path: .artifacts/jrn002/gate-summary.json
          if-no-files-found: error
