version: '3.8'

services:
  # --- Reverse Proxy ---
  caddy:
    image: caddy:2-alpine
    container_name: tradingnoobs-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend
    networks:
      - tradingnoobs

  # --- Database ---
  db:
    image: postgres:16-alpine
    container_name: tradingnoobs-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${DB_PASSWORD:-postgres}
      - POSTGRES_DB=tradingnoobs
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d tradingnoobs" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - tradingnoobs
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # --- Application Backend ---
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tradingnoobs-backend
    restart: unless-stopped
    expose:
      - "8000" # Only expose to standard internal network
    environment:
      - DATABASE_URL=postgresql://postgres:${DB_PASSWORD:-postgres}@db:5432/tradingnoobs
      - SECRET_KEY=${SECRET_KEY}
      - CORS_ORIGINS=https://${DOMAIN:-localhost},http://${DOMAIN:-localhost},http://localhost:3000
      - DEPLOYMENT_CAPABILITY_ALLOWLIST=
    depends_on:
      db:
        condition: service_healthy
    networks:
      - tradingnoobs
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # --- Application Frontend ---
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=https://${DOMAIN:-localhost}
    container_name: tradingnoobs-frontend
    restart: unless-stopped
    expose:
      - "3000"
    depends_on:
      - backend
    networks:
      - tradingnoobs
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # --- Database Backup ---
  db-backup:
    image: prodrigestivill/postgres-backup-local
    restart: unless-stopped
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_DB=tradingnoobs
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${DB_PASSWORD:-postgres}
      - SCHEDULE=@daily # Daily backup
      - BACKUP_KEEP_DAYS=7 # Keep 7 daily backups
      - BACKUP_KEEP_WEEKS=4 # Keep 4 weekly backups
      - BACKUP_KEEP_MONTHS=6 # Keep 6 monthly backups
      - HEALTHCHECK_PORT=8080
    volumes:
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy
    networks:
      - tradingnoobs

networks:
  tradingnoobs:
    driver: bridge

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
