version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tradingnoobs-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:${DB_PASSWORD:-postgres}@db:5432/tradingnoobs
      - SECRET_KEY=${SECRET_KEY}
      - CORS_ORIGINS=https://${DOMAIN:-localhost}
    depends_on:
      - db
    networks:
      - tradingnoobs
      - web-proxy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=https://${DOMAIN:-localhost}/api
    container_name: tradingnoobs-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - tradingnoobs
      - web-proxy

  db:
    image: postgres:16-alpine
    container_name: tradingnoobs-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${DB_PASSWORD:-postgres}
      - POSTGRES_DB=tradingnoobs
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - tradingnoobs

networks:
  tradingnoobs:
    driver: bridge
  web-proxy:
    external: true

volumes:
  postgres_data:
